# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${BASE_PATH}"
        env:
          JEKYLL_ENV: production
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/LJT-Homepage' }}
      - name: Verify personal page content
        run: |
          test -f _site/index.html
          grep -q "Junteng Liu" _site/index.html
          grep -q "Research Experience" _site/index.html
          grep -q "SynLogic" _site/index.html
          grep -q "C-Eval" _site/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          test -f _site/cv/index.html
          test -f _site/publications/index.html
          test "$(grep -o 'archive__item-title' _site/publications/index.html | wc -l)" -eq 6
          test "$(grep -o 'archive__item-title' _site/cv/index.html | wc -l)" -eq 6
          grep -q "2025" _site/publications/index.html
          if grep -q "1900" _site/publications/index.html; then exit 1; fi
          for publication in synlogic perception-bottleneck-of-vlms-for-chart-understanding universal-truthfulness-hyperplane-inside-llms in-context-sharpness-as-alerts c-eval composing-parameter-efficient-modules-with-arithmetic-operations; do
            test -f "_site/publication/${publication}/index.html"
          done
          echo "Personal page content verified."
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
